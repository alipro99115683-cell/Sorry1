<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1633">
<title>یه چیزی برات نوشتم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1c1633;
    --dusk:#4a2c5e;
    --glow:#7a3e65;
    --rose:#f08a9b;
    --peach:#ffc9a8;
    --moon:#fbf3ea;
    --ink:#2a2140;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:var(--night);
    color:var(--moon);
    line-height:1.9;
    overflow-x:hidden;
  }
  :focus-visible{outline:3px solid var(--peach);outline-offset:3px}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--night) 0%,var(--dusk) 60%,var(--glow) 100%);
    overflow:hidden;
  }
  .stars{
    position:absolute;pointer-events:none;
    width:220%;height:220%;left:-60%;top:-60%;
    transform-origin:50% 50%;
    animation:spin 240s linear infinite;
  }
  .stars i{
    position:absolute;border-radius:50%;background:var(--moon);
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .moon{
    width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff7ec,var(--peach));
    box-shadow:0 0 60px 14px rgba(255,201,168,.35);
    margin-bottom:36px;
  }
  h1{
    font-family:'Lalezar','Vazirmatn',sans-serif;
    font-weight:400;
    font-size:clamp(44px,15vw,72px);
    line-height:1.3;
    min-height:2.7em;
  }
  .caret{display:inline-block;width:3px;height:.9em;background:var(--peach);vertical-align:-.1em;margin-inline-start:4px;animation:blink 1s steps(2) infinite}
  .sub{
    margin-top:18px;max-width:30ch;font-weight:300;font-size:17px;color:#eadfd4;
    opacity:0;transition:opacity 1.2s ease .2s;
  }
  .sub.show{opacity:1}
  .scroll{
    margin-top:44px;
    background:none;border:1.5px solid rgba(251,243,234,.5);color:var(--moon);
    font:inherit;font-size:16px;padding:12px 28px;border-radius:999px;cursor:pointer;
    opacity:0;transition:opacity 1s ease 1s;
  }
  .scroll.show{opacity:1}

  /* ---------- Sections ---------- */
  main{max-width:520px;margin:0 auto;padding:0 20px}
  section{padding:72px 0 0}
  h2{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400;font-size:32px;line-height:1.4;margin-bottom:20px}

  .letter{
    background:var(--moon);color:var(--ink);
    border-radius:22px;padding:28px 24px;
    font-size:17.5px;
  }
  .letter p+p{margin-top:16px}
  .letter .sign{margin-top:22px;font-weight:600;color:#a23f5a}

  .promises{list-style:none}
  .promises li{
    padding:14px 18px 14px 0;
    border-right:3px solid var(--rose);
    padding-right:16px;
    margin-bottom:14px;
    font-size:17px;
  }

  .days{
    text-align:center;
    padding:36px 20px;
    border-radius:22px;
    background:rgba(255,255,255,.06);
  }
  .days b{display:block;font-family:'Lalezar',sans-serif;font-weight:400;font-size:64px;line-height:1.2;color:var(--peach)}
  .days span{font-weight:300}

  /* ---------- Final question ---------- */
  .ask{text-align:center;padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:80svh}
  .ask h2{font-size:38px;margin-bottom:8px}
  .ask p.hint{min-height:2em;font-weight:300;color:#eadfd4;margin-bottom:30px}
  .btns{display:flex;flex-direction:column;align-items:center;gap:16px;min-height:150px}
  .yes{
    font:inherit;font-weight:600;font-size:18px;
    background:var(--rose);color:#2a1020;border:none;border-radius:999px;
    padding:14px 34px;cursor:pointer;
    transition:transform .25s ease;
    transform-origin:center;
  }
  .no{
    font:inherit;font-size:15px;
    background:transparent;color:var(--moon);border:1.5px solid rgba(251,243,234,.45);
    border-radius:999px;padding:10px 24px;cursor:pointer;
    transition:left .25s ease,top .25s ease;
  }
  .no.run{position:fixed;z-index:5}

  .result{display:none;text-align:center;padding-top:20px}
  .result.show{display:block}
  .result .big{font-family:'Lalezar',sans-serif;font-size:52px;line-height:1.3;color:var(--peach);margin-bottom:12px}
  .result p{font-size:18px;max-width:28ch;margin:0 auto 28px}
  .reply{
    font:inherit;font-weight:600;font-size:17px;
    background:var(--moon);color:var(--ink);border:none;border-radius:999px;
    padding:14px 30px;cursor:pointer;
  }

  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

  @keyframes blink{to{visibility:hidden}}
  @media (prefers-reduced-motion:reduce){
    .caret{animation:none}
    .stars,.stars i{animation:none}
    .sub,.scroll{transition:none}
    .yes,.no{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <h1 id="title" aria-live="polite"></h1>
  <p class="sub" id="sub"></p>
  <button class="scroll" id="go">بخونش</button>
</header>

<main>
  <section id="letter">
    <h2>اول بذار بگم</h2>
    <div class="letter" id="letterBox"></div>
  </section>

  <section>
    <h2>اینا رو قول میدم</h2>
    <ul class="promises" id="promises"></ul>
  </section>

  <section id="daysSec" hidden>
    <div class="days">
      <span>تا الان ما این‌قدر روز با هم بودیم</span>
      <b id="daysNum">0</b>
      <span>روز، و میخوام روزای بعدیمون رو قشنگ‌تر کنم</span>
    </div>
  </section>

  <section class="ask" id="ask">
    <div id="question">
      <h2 id="qTitle"></h2>
      <p class="hint" id="hint"></p>
      <div class="btns" id="btns">
        <button class="yes" id="yes">آره، بخشیدمت</button>
        <button class="no" id="no">نه</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="big">مرسی عشقم</div>
      <p id="thanks"></p>
      <button class="reply" id="reply">جواب بده بهم</button>
    </div>
  </section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* =====================================================
   اینجا رو با اطلاعات خودت عوض کن
   ===================================================== */
const CONFIG = {
  herName: "عزیزم",              // اسمش یا لقبی که صداش میزنی
  myName: "من",                  // اسم خودت
  startDate: "2026-02-26",                 // تاریخ شروع رابطه به این شکل: "2024-05-20" (خالی بذاری شمارنده نمایش داده نمیشه)
  myPhone: "09306513683",                   // شماره خودت برای ارسال پیامک جواب (مثلا 09120000000). خالی بذاری از منوی اشتراک گذاری استفاده میشه
  subtitle: "یه چیزی هست که میخوام بهت بگم، لطفا تا آخرش بخون.",
  letter: [
    "اشتباه کردم و این رو بدون هیچ ولی و اگری قبول دارم و واقعا خیلی اشتباه کردم",
    "ببخشید مامانی من اعصبانی بودم ی حرفایی ازم که نباید میزدم ببخشید مامانی پسلی رو لطفا ببخش .",
    "دلم نمیخواد بحث رو ببرم و تو رو ببازم. تو برام خیلی مهمتر از این حرفایی مامانی."
  ],
  promises: [
    "بیشتر به حرفات گوش کنم و دیگه ناراحتت نکنم",
    "وقتی ناراحتی، بپرسم چی شده و نزارم دیگه ناراحت باشی و نمیزارم دیگه گریه کنی",
    "اگه اشتباه کردم، زودتر بگم و معذرت‌خواهی رو عقب نندازم."
  ],
  question: "منو میبخشی؟",
  hint: "",
  thanks: "قول میدم کاری کنم که از این آشتی پشیمون نشی. خیلی دوستت دارم💙🫂 مامانی ستایش. عشقم، حالا بیا سروش",
  noLines: [
    "مطمئنی؟", "یه بار دیگه فکر کن", "خواهش میکنم عزیزم لطفا", "من که نگفتم همیشه حق با منه",
    "مامانی ببخش منو دیگه😭", "مامانی لطفا دیگه تکرار نمیشه😭 ببخش 😭", "دیگه بگیرش، نمیتونی 😅"
  ]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ستاره‌ها */
(function(){
  const s = $('stars');
  for(let i=0;i<110;i++){
    const d = document.createElement('i');
    const size = Math.random() < 0.15 ? 3.5 : (1.5 + Math.random()*1.5);
    d.style.width = d.style.height = size + 'px';
    d.style.top = (Math.random()*100)+'%';
    d.style.left = (Math.random()*100)+'%';
    d.style.animationDuration = (2.5 + Math.random()*4).toFixed(1) + 's';
    d.style.animationDelay = (-Math.random()*6).toFixed(1) + 's';
    if(size > 3) d.style.boxShadow = '0 0 8px 2px rgba(251,243,234,.6)';
    s.appendChild(d);
  }
})();

/* متن‌ها */
document.title = "یه چیزی برات نوشتم، " + CONFIG.herName;
$('sub').textContent = CONFIG.subtitle;
$('qTitle').textContent = CONFIG.question;
$('hint').textContent = CONFIG.hint;
$('thanks').textContent = CONFIG.thanks;

const letterBox = $('letterBox');
CONFIG.letter.forEach(t => { const p=document.createElement('p'); p.textContent=t; letterBox.appendChild(p); });
const sign = document.createElement('p');
sign.className = 'sign';
sign.textContent = "— " + CONFIG.myName;
letterBox.appendChild(sign);

CONFIG.promises.forEach(t => { const li=document.createElement('li'); li.textContent=t; $('promises').appendChild(li); });

if(CONFIG.startDate){
  const m = CONFIG.startDate.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  let days = 0;
  if(m){
    const start = new Date(+m[1], +m[2]-1, +m[3]);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    days = Math.round((today - start)/86400000);
  }
  if(days > 0){ $('daysNum').textContent = days.toLocaleString('fa-IR'); $('daysSec').hidden = false; }
}

/* تایپ تیتر (فقط یک بار) */
(function(){
  const full = "ببخشید، " + CONFIG.herName;
  const el = $('title');
  const finish = () => { $('sub').classList.add('show'); $('go').classList.add('show'); };
  if(reduce){ el.textContent = full; finish(); return; }
  const caret = document.createElement('span'); caret.className='caret';
  el.appendChild(caret);
  let i = 0;
  const tick = () => {
    el.insertBefore(document.createTextNode(full[i]), caret);
    i++;
    if(i < full.length){ setTimeout(tick, 110); }
    else { setTimeout(()=>{ caret.remove(); finish(); }, 500); }
  };
  setTimeout(tick, 600);
})();

$('go').addEventListener('click', () => $('letter').scrollIntoView({behavior: reduce?'auto':'smooth'}));

/* دکمه نه که فرار میکنه و دکمه آره که بزرگ میشه */
let tries = 0;
const yes = $('yes'), no = $('no');

function dodge(e){
  if(e) e.preventDefault();
  tries++;
  no.textContent = CONFIG.noLines[Math.min(tries-1, CONFIG.noLines.length-1)];
  yes.style.transform = 'scale(' + Math.min(1 + tries*0.18, 2.2) + ')';
  yes.style.marginBottom = (tries*8) + 'px';

  no.classList.add('run');
  const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
  const maxL = window.innerWidth - w - pad;
  const maxT = window.innerHeight - h - pad;
  no.style.left = (pad + Math.random()*(maxL-pad)) + 'px';
  no.style.top  = (pad + Math.random()*(maxT-pad)) + 'px';
}
no.addEventListener('click', dodge);
no.addEventListener('touchstart', dodge, {passive:false});
no.addEventListener('mouseenter', () => { if(tries>0) dodge(); });

/* آره */
yes.addEventListener('click', () => {
  $('question').style.display = 'none';
  $('result').classList.add('show');
  no.remove();
  $('result').scrollIntoView({behavior: reduce?'auto':'smooth', block:'center'});
  if(!reduce) hearts();
});

/* ارسال جواب */
$('reply').addEventListener('click', async () => {
  const msg = "بخشیدمت 💙";
  if(CONFIG.myPhone){
    location.href = 'sms:' + CONFIG.myPhone + '?&body=' + encodeURIComponent(msg);
  } else if(navigator.share){
    try{ await navigator.share({text: msg}); }catch(e){}
  } else {
    alert("یه اسکرین‌شات بگیر و برام بفرست 💙");
  }
});

/* قلب‌های ریزان */
function hearts(){
  const c = $('fx'), ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr;
  ctx.scale(dpr,dpr);
  const blues = ['#2f7bff','#4a90ff','#1f5fe0','#6fb1ff','#3b6fd8'];
  function heart(x, y, s, color){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s/30, s/30);
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-18, -4, -12, -22, 0, -10);
    ctx.bezierCurveTo(12, -22, 18, -4, 0, 8);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }
  const ps = Array.from({length:60}, () => ({
    x: Math.random()*innerWidth,
    y: -20 - Math.random()*innerHeight*0.6,
    v: 2 + Math.random()*3,
    s: 18 + Math.random()*20,
    c: blues[Math.floor(Math.random()*blues.length)],
    w: Math.random()*Math.PI*2
  }));
  const start = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => {
      p.y += p.v; p.w += 0.05;
      heart(p.x + Math.sin(p.w)*14, p.y, p.s, p.c);
    });
    if(t - start < 4500){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,innerWidth,innerHeight); }
  })(start);
}
</script>
</body>
</html>
